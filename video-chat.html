<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b18">
  <title>世界杯视频解说互动</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b18;
      --bg-soft: #0d1424;
      --panel: rgba(255, 255, 255, .08);
      --panel-strong: rgba(255, 255, 255, .13);
      --line: rgba(255, 255, 255, .14);
      --text: #f8fafc;
      --muted: #a8b3c7;
      --gold: #f5c451;
      --mint: #5eead4;
      --blue: #60a5fa;
      --rose: #fb7185;
      --green: #86efac;
      --shadow: 0 24px 80px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(135deg, rgba(96, 165, 250, .16), transparent 28%),
        linear-gradient(215deg, rgba(245, 196, 81, .14), transparent 32%),
        linear-gradient(180deg, #070b18 0%, #0b1222 48%, #111827 100%);
      color: var(--text);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px min(5vw, 58px);
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      background: rgba(7, 11, 24, .82);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 850;
    }

    .brand-mark {
      display: block;
      width: 96px;
      height: 42px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav-links a,
    .chip,
    .mini-btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .06);
      color: var(--text);
    }

    .nav-links a {
      padding: 8px 11px;
    }

    .nav-links a:hover,
    .mini-btn:hover,
    .chip:hover {
      border-color: rgba(94, 234, 212, .48);
      background: rgba(94, 234, 212, .11);
    }

    .shell {
      width: min(1540px, 100%);
      margin: 0 auto;
      padding: 24px min(5vw, 58px) 40px;
    }

    .watch-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 430px);
      gap: 18px;
      align-items: start;
    }

    .stage,
    .chat-panel,
    .transcript-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .045));
      box-shadow: var(--shadow);
    }

    .stage {
      overflow: hidden;
      min-width: 0;
    }

    .stage-head,
    .panel-head,
    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      background: rgba(7, 11, 24, .42);
    }

    .stage-title,
    .panel-title,
    .chat-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 0 4px rgba(251, 113, 133, .12);
    }

    .status-dot.ready {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(134, 239, 172, .12);
    }

    .status-dot.local {
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(245, 196, 81, .12);
    }

    .video-wrap {
      position: relative;
      background: #020617;
      aspect-ratio: 16 / 9;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #020617;
    }

    .event-action-bar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      background: rgba(2, 6, 23, .74);
    }

    .event-timeline {
      display: none;
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 44px;
      height: 62px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(2, 6, 23, .52);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .28);
      pointer-events: auto;
      z-index: 3;
    }

    .event-timeline.visible {
      display: block;
    }

    .event-marker {
      position: absolute;
      top: 5px;
      min-width: 54px;
      height: 24px;
      border: 0;
      border-radius: 8px;
      padding: 0 8px;
      transform: translateX(-50%);
      color: #06101d;
      background: var(--event-color, var(--gold));
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--event-color, var(--gold)) 24%, transparent), 0 0 18px color-mix(in srgb, var(--event-color, var(--gold)) 58%, transparent);
    }

    .event-marker[data-kind="build"],
    .event-card[data-kind="build"] {
      --event-color: var(--blue);
    }

    .event-marker[data-kind="shape"],
    .event-card[data-kind="shape"] {
      --event-color: #a78bfa;
    }

    .event-marker[data-kind="defense"],
    .event-card[data-kind="defense"] {
      --event-color: var(--mint);
    }

    .event-marker[data-kind="attack"],
    .event-card[data-kind="attack"] {
      --event-color: var(--gold);
    }

    .event-marker[data-kind="goal"] {
      --event-color: var(--rose);
    }

    .event-card[data-kind="goal"] {
      --event-color: var(--rose);
    }

    .event-marker[data-kind="review"],
    .event-card[data-kind="review"] {
      --event-color: #fb923c;
    }

    .event-marker[data-kind="summary"],
    .event-card[data-kind="summary"] {
      --event-color: #c4b5fd;
    }

    .event-marker.active {
      background: var(--mint);
      box-shadow: 0 0 0 5px rgba(94, 234, 212, .2), 0 0 22px rgba(94, 234, 212, .62);
    }

    .event-marker[data-row="1"] {
      top: 33px;
    }

    .event-marker::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 9px);
      width: 240px;
      min-height: 66px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .16);
      padding: 10px 11px;
      color: #e5edf9;
      background: rgba(7, 11, 24, .94);
      box-shadow: 0 18px 44px rgba(0, 0, 0, .42);
      content: attr(data-detail);
      white-space: normal;
      line-height: 1.45;
      text-align: left;
      font-size: 12px;
      font-weight: 650;
      opacity: 0;
      transform: translateX(-50%);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .event-marker:hover::after,
    .event-marker:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, -4px);
    }

    .caption-bar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      min-width: 0;
      color: #dbeafe;
    }

    .time-badge,
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .15);
      color: #dbeafe;
      background: rgba(96, 165, 250, .12);
      white-space: nowrap;
      font-size: 12px;
    }

    .caption-text {
      overflow: hidden;
      min-width: 0;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #f8fafc;
      font-weight: 700;
    }

    .mini-btn {
      min-height: 34px;
      padding: 0 12px;
      font-size: 13px;
    }

    .chat-panel {
      position: sticky;
      top: 84px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      height: min(760px, calc(100vh - 108px));
      min-height: 560px;
      max-height: calc(100vh - 108px);
      overflow: hidden;
    }

    .chat-head {
      align-items: start;
    }

    .panel-tabs {
      display: flex;
      gap: 6px;
    }

    .panel-tab {
      min-height: 30px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--muted);
      background: rgba(255, 255, 255, .06);
      font-size: 12px;
    }

    .panel-tab.active {
      color: #06101d;
      border-color: transparent;
      background: linear-gradient(135deg, var(--gold), var(--mint));
      font-weight: 850;
    }

    .chat-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .team-context {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
      background: rgba(7, 11, 24, .32);
    }

    .control {
      width: 100%;
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, .08);
      padding: 0 10px;
      outline: none;
    }

    select.control {
      appearance: none;
      color: var(--text);
      color-scheme: light;
      background:
        linear-gradient(45deg, transparent 50%, #dbeafe 50%) calc(100% - 18px) 50% / 6px 6px no-repeat,
        linear-gradient(135deg, #dbeafe 50%, transparent 50%) calc(100% - 13px) 50% / 6px 6px no-repeat,
        rgba(15, 23, 42, .96);
      padding-right: 38px;
    }

    select.control option,
    select.control optgroup {
      color: #0f172a;
      background: #f8fafc;
    }

    .control:focus,
    textarea:focus {
      border-color: rgba(94, 234, 212, .68);
      box-shadow: 0 0 0 4px rgba(94, 234, 212, .1);
    }

    .chat-log {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, .72) rgba(15, 23, 42, .42);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
    }

    .chat-log::-webkit-scrollbar,
    .transcript::-webkit-scrollbar {
      width: 10px;
    }

    .chat-log::-webkit-scrollbar-track,
    .transcript::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, .42);
      border-radius: 999px;
    }

    .chat-log::-webkit-scrollbar-thumb,
    .transcript::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, .72);
      border: 2px solid rgba(15, 23, 42, .42);
      border-radius: 999px;
    }

    .message {
      width: fit-content;
      max-width: 92%;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      padding: 11px 12px;
      line-height: 1.58;
      color: #e5edf9;
      background: rgba(255, 255, 255, .075);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .message > *:first-child { margin-top: 0; }
    .message > *:last-child { margin-bottom: 0; }
    .message p { margin: 8px 0; }
    .message h2,
    .message h3 {
      margin: 10px 0 6px;
      font-size: 15px;
      line-height: 1.35;
    }
    .message ul,
    .message ol {
      margin: 8px 0;
      padding-left: 20px;
    }
    .message li { margin: 4px 0; }
    .message code {
      padding: 2px 5px;
      border-radius: 5px;
      color: #fef3c7;
      background: rgba(245, 196, 81, .12);
    }

    .message pre {
      margin: 10px 0;
      max-width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(2, 6, 23, .72);
      padding: 10px;
    }

    .message pre code {
      padding: 0;
      color: #dbeafe;
      background: transparent;
      white-space: pre;
    }

    .message blockquote {
      margin: 10px 0;
      padding: 8px 10px;
      border-left: 3px solid rgba(94, 234, 212, .62);
      color: #cbd5e1;
      background: rgba(94, 234, 212, .08);
    }

    .message table {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      margin: 10px 0;
    }

    .message th,
    .message td {
      border: 1px solid rgba(255, 255, 255, .14);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    .message th {
      color: #fef3c7;
      background: rgba(245, 196, 81, .1);
    }

    .message a {
      color: #93c5fd;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .message.user { white-space: pre-wrap; }

    .message.user {
      align-self: flex-end;
      color: #06101d;
      background: linear-gradient(135deg, var(--gold), var(--mint));
      font-weight: 700;
    }

    .message.system {
      width: auto;
      max-width: 100%;
      color: #cbd5e1;
      background: rgba(96, 165, 250, .1);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 14px 12px;
    }

    .form-label {
      padding: 0 14px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px 8px;
    }

    .mode-row .form-label {
      padding: 0;
    }

    .chip {
      min-height: 32px;
      padding: 0 10px;
      font-size: 12px;
    }

    .chip:focus-visible,
    .mini-btn:focus-visible,
    .voice-btn:focus-visible,
    .send-btn:focus-visible {
      outline: 3px solid rgba(94, 234, 212, .26);
      outline-offset: 2px;
    }

    .chat-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 9px;
      padding: 12px 14px 14px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      background: rgba(7, 11, 24, .44);
    }

    textarea {
      min-height: 48px;
      max-height: 140px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, .08);
      padding: 11px 12px;
      outline: none;
      line-height: 1.42;
    }

    .voice-btn {
      width: 52px;
      min-width: 52px;
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 12px;
      color: var(--text);
      background: rgba(255, 255, 255, .09);
      display: grid;
      place-items: center;
      position: relative;
    }

    .voice-btn span[aria-hidden="true"] {
      font-size: 22px;
      line-height: 1;
    }

    .voice-btn.listening {
      color: #06101d;
      background: linear-gradient(135deg, var(--mint), var(--gold));
      box-shadow: 0 0 0 0 rgba(94, 234, 212, .42);
      animation: listenPulse 1.25s ease-out infinite;
    }

    .voice-btn:disabled {
      opacity: .58;
      cursor: wait;
    }

    .voice-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes listenPulse {
      100% { box-shadow: 0 0 0 13px rgba(94, 234, 212, 0); }
    }

    .send-btn {
      width: 74px;
      min-width: 74px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      color: #06101d;
      background: linear-gradient(135deg, var(--gold), var(--mint));
      font-weight: 850;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .send-btn:disabled {
      opacity: .58;
      cursor: wait;
    }

    .send-btn img {
      width: 34px;
      height: 34px;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.18));
    }

    .send-btn .send-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .mode-toggle {
      min-height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(94, 234, 212, .32);
      color: #eaf7ff;
      background: rgba(96, 165, 250, .14);
      font-size: 12px;
    }

    .lower-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      margin-top: 18px;
    }

    .transcript-panel {
      overflow: hidden;
    }

    .transcript {
      max-height: 340px;
      overflow: auto;
      padding: 10px;
    }

    .cue {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 8px;
      color: #cbd5e1;
      background: transparent;
      text-align: left;
    }

    .cue:hover,
    .cue.active {
      color: var(--text);
      background: rgba(94, 234, 212, .11);
    }

    .cue-time {
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    .cue-text {
      overflow-wrap: anywhere;
      line-height: 1.45;
      font-size: 13px;
    }

    .event-board {
      display: none;
      min-height: 0;
      overflow: auto;
      padding: 12px 14px;
      gap: 10px;
    }

    .chat-panel.board-mode {
      grid-template-rows: auto auto 1fr;
    }

    .chat-panel.board-mode .chat-log,
    .chat-panel.board-mode .chat-tools {
      display: none;
    }

    .chat-panel.board-mode .event-board {
      display: grid;
    }

    .event-card {
      width: 100%;
      border: 1px solid color-mix(in srgb, var(--event-color, var(--gold)) 42%, transparent);
      border-left: 5px solid var(--event-color, var(--gold));
      border-radius: 8px;
      padding: 11px;
      color: #e5edf9;
      background: color-mix(in srgb, var(--event-color, var(--gold)) 13%, rgba(255, 255, 255, .06));
      text-align: left;
    }

    .event-card:hover,
    .event-card.active {
      border-color: color-mix(in srgb, var(--event-color, var(--gold)) 70%, rgba(255, 255, 255, .18));
      background: color-mix(in srgb, var(--event-color, var(--gold)) 22%, rgba(255, 255, 255, .07));
    }

    .event-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .event-card-title {
      color: var(--event-color, #fff7d1);
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .event-card-text {
      color: #cbd5e1;
      line-height: 1.5;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1120px) {
      .watch-grid,
      .lower-grid {
        grid-template-columns: 1fr;
      }

      .chat-panel {
        position: static;
        height: min(640px, calc(100vh - 110px));
        min-height: 480px;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: start;
        flex-direction: column;
      }

      .nav-links {
        width: 100%;
        overflow-x: auto;
      }

      .shell {
        padding: 14px 12px 26px;
      }

      .stage-head,
      .event-action-bar,
      .caption-bar,
      .chat-form {
        grid-template-columns: 1fr;
      }

      .event-action-bar,
      .caption-bar {
        align-items: start;
      }

      .caption-text {
        white-space: normal;
      }

      .chat-panel {
        height: 62vh;
        min-height: 420px;
      }

    }
  </style>
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/SM-logo.svg" alt="SM logo">
      <span>智能解说交互</span>
    </a>
    <div class="nav-links">
      <a href="index.html">球员页面</a>
      <a href="#chatLog">实时问答</a>
      <a href="#transcriptPanel">字幕</a>
    </div>
  </nav>

  <main class="shell">
    <section class="watch-grid">
      <article class="stage">
        <header class="stage-head">
          <div>
            <h1 class="stage-title">比赛视频解说</h1>
          </div>
          <button class="mini-btn" id="fullscreenBtn" type="button">全屏</button>
        </header>
        <div class="video-wrap" id="videoWrap">
          <video id="matchVideo" controls playsinline preload="metadata">
            <source src="assets/video/final-video-girl.mp4" type="video/mp4">
            <track src="assets/video/interaction-commentary.vtt" kind="subtitles" srclang="zh" label="中文" default>
          </video>
          <div class="event-timeline" id="eventTimeline" aria-label="关键事件时间轴"></div>
        </div>
        <div class="event-action-bar">

    const keyEvents = [

      { id: "summary", time: 116.32, cueIndex: 14, kind: "summary", title: "阶段总结", text: "阿根廷暂时一比零领先。", script: "这一段结束时，阿根廷暂时一比零领先。", tag: "总结" }
    ];
    const messages = [];
    let cues = [];
    let siteData = null;
    let pending = false;
    let apiErrorNotified = false;
    let demoCaption = null;
    let demoSubtitleCue = null;
    let recognition = null;
    let listening = false;
    let interactionMode = "api";
    let eventsVisible = false;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function resolveChatEndpoint() {
      const params = new URLSearchParams(location.search);
      const queryApiUrl = params.get("api");
      if (queryApiUrl && /^https:\/\//i.test(queryApiUrl)) {
        localStorage.setItem("VIDEO_CHAT_API_URL", queryApiUrl.trim());
      }
      const configured = String(
        window.VIDEO_CHAT_API_URL ||
        chatConfig.apiUrl ||
        localStorage.getItem("VIDEO_CHAT_API_URL") ||
        ""
      ).trim();
      if (configured) return configured;
      const localHosts = new Set(["localhost", "127.0.0.1", "::1", "[::1]"]);
      if (localHosts.has(location.hostname) && location.port) {
        return `${location.origin}/chat`;
      }
      return "";
    }

    function safeLink(url) {
      const trimmed = String(url || "").trim();
      return /^https?:\/\//i.test(trimmed) ? trimmed.replace(/"/g, "%22") : "#";
    }

    function inlineMarkdown(value) {
      const codeTokens = [];
      let text = esc(value).replace(/`([^`]+)`/g, (_, code) => {
        const token = `@@CODE${codeTokens.length}@@`;
        codeTokens.push(`<code>${code}</code>`);
        return token;
      });
      text = text
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, label, url) => `<a href="${safeLink(url)}" target="_blank" rel="noreferrer">${label}</a>`)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/__([^_]+)__/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
        .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>");
      return text.replace(/@@CODE(\d+)@@/g, (_, index) => codeTokens[Number(index)] || "");
    }

    function splitTableRow(line) {
      return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
    }

    function isTableDivider(line) {
      return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
    }

    function renderTable(headerLine, rowLines) {
      const headers = splitTableRow(headerLine);
      const body = rowLines.map(line => splitTableRow(line));
      return [
        "<table><thead><tr>",
        ...headers.map(cell => `<th>${inlineMarkdown(cell)}</th>`),
        "</tr></thead><tbody>",
        ...body.map(row => `<tr>${headers.map((_, index) => `<td>${inlineMarkdown(row[index] || "")}</td>`).join("")}</tr>`),
        "</tbody></table>"
      ].join("");
    }

    function markdownToHtml(markdown) {
      const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let listType = "";
      let paragraph = [];
      const closeList = () => {
        if (!listType) return;
        html.push(`</${listType}>`);
        listType = "";
      };
      const closeParagraph = () => {
        if (!paragraph.length) return;
        html.push(`<p>${paragraph.map(inlineMarkdown).join("<br>")}</p>`);
        paragraph = [];
      };
      for (let index = 0; index < lines.length; index += 1) {
        const rawLine = lines[index];
        const line = rawLine.trim();
        if (line.startsWith("```")) {
          closeParagraph();
          closeList();
          const code = [];
          index += 1;
          while (index < lines.length && !lines[index].trim().startsWith("```")) {
            code.push(lines[index]);
            index += 1;
          }
          html.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
          continue;
        }
        if (!line) {
          closeParagraph();
          closeList();
          continue;
        }
        if (line.includes("|") && lines[index + 1] && isTableDivider(lines[index + 1])) {
          closeParagraph();
          closeList();
          const rows = [];
          index += 2;
          while (index < lines.length && lines[index].trim().includes("|")) {
            rows.push(lines[index]);
            index += 1;
          }
          index -= 1;
          html.push(renderTable(line, rows));
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          closeParagraph();
          closeList();
          html.push(`<h${Math.min(heading[1].length + 1, 3)}>${inlineMarkdown(heading[2])}</h${Math.min(heading[1].length + 1, 3)}>`);
          continue;
        }
        if (/^(-{3,}|\*{3,})$/.test(line)) {
          closeParagraph();
          closeList();
          html.push("<hr>");
          continue;
        }
        const quote = line.match(/^>\s?(.*)$/);
        if (quote) {
          closeParagraph();
          closeList();
          const quoteLines = [quote[1]];
          while (index + 1 < lines.length && /^>\s?/.test(lines[index + 1].trim())) {
            index += 1;
            quoteLines.push(lines[index].trim().replace(/^>\s?/, ""));
          }
          html.push(`<blockquote>${quoteLines.map(inlineMarkdown).join("<br>")}</blockquote>`);
          continue;
        }
        const unordered = line.match(/^[-*]\s+(.+)$/);
        if (unordered) {
          closeParagraph();
          if (listType !== "ul") {
            closeList();
            html.push("<ul>");
            listType = "ul";
          }
          html.push(`<li>${inlineMarkdown(unordered[1])}</li>`);
          continue;
        }
        const ordered = line.match(/^\d+\.\s+(.+)$/);
        if (ordered) {
          closeParagraph();
          if (listType !== "ol") {
            closeList();
            html.push("<ol>");
            listType = "ol";
          }
          html.push(`<li>${inlineMarkdown(ordered[1])}</li>`);
          continue;
        }
        closeList();
        paragraph.push(line);
      }
      closeParagraph();
      closeList();
      return html.join("");
    }

    function parseTime(value) {
      const [hour, minute, rest] = value.trim().replace(",", ".").split(":");
      return Number(hour) * 3600 + Number(minute) * 60 + Number(rest);
    }

    function formatTime(seconds) {
      const safe = Math.max(0, Number(seconds) || 0);
      const minute = Math.floor(safe / 60);
      const second = Math.floor(safe % 60);
      return `${String(minute).padStart(2, "0")}:${String(second).padStart(2, "0")}`;
    }

    function parseSrt(raw) {
      return raw.trim().split(/\n\s*\n/).map(block => {
        const lines = block.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        if (lines.length < 3 || !lines[1].includes("-->")) return null;
        const [start, end] = lines[1].split("-->").map(part => part.trim());
        return {
          index: Number(lines[0]),
          start: parseTime(start),
          end: parseTime(end),
          text: lines.slice(2).join(" ")
        };
      }).filter(Boolean);
    }

    function parseCommentaryJson(items) {
      return (Array.isArray(items) ? items : []).map((item, index) => ({
        index: index + 1,
        start: Number(item.start) || 0,
        end: Number(item.end) || Number(item.start) + 4 || 4,
        text: String(item.text || "").trim(),
        emotion: item.emotion || ""
      })).filter(cue => cue.text && cue.end >= cue.start);
    }

    function currentCue() {
      const now = video.currentTime || 0;
      return cues.find(cue => cue.start <= now && cue.end >= now) || null;
    }

    function nearbyCues(before = 100, after = 20) {
      const now = video.currentTime || 0;
      const start = Math.max(0, now - before);
      const end = now + after;
      return cues.filter(cue => cue.end >= start && cue.start <= end);
    }

    function renderMessage(role, content) {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      node.innerHTML = role === "user" ? esc(content) : markdownToHtml(content);
      chatLog.appendChild(node);
      chatLog.scrollTop = chatLog.scrollHeight;
      return node;
    }

    function setApiState(state, label) {
      statusDot.classList.toggle("ready", state === "ready");
      statusDot.classList.toggle("local", state === "local");
      apiStatus.textContent = label;
    }

    function eventDuration() {
      return video.duration && Number.isFinite(video.duration)
        ? video.duration
        : Math.max(...keyEvents.map(event => event.time), ...cues.map(cue => cue.end), 120);
    }

    function seekTo(seconds) {
      video.currentTime = Math.max(0, seconds + 0.05);
      video.play();
    }

    function nearestEvent(now = video.currentTime || 0) {
      return keyEvents.find((event, index) => {
        const next = keyEvents[index + 1]?.time ?? eventDuration();
        return now >= event.time && now < next;
      }) || null;
    }

    function setBoardMode(mode) {
      const board = mode === "board";
      chatPanel.classList.toggle("board-mode", board);
      chatTab.classList.toggle("active", !board);
      boardTab.classList.toggle("active", board);
    }

    function renderKeyEvents() {
      const duration = Math.max(eventDuration(), 1);
      const rowEnds = [-Infinity, -Infinity];
      eventTimeline.innerHTML = keyEvents.map(event => {
        const row = event.time - rowEnds[0] < 6 ? 1 : 0;
        rowEnds[row] = event.time;
        return `
        <button class="event-marker" type="button" data-event="${esc(event.id)}" data-kind="${esc(event.kind)}" data-row="${row}" data-detail="${esc(formatTime(event.time) + " · " + event.title + "：" + event.text)}" style="left: ${(event.time / duration) * 100}%">${esc(event.tag)}</button>
      `;
      }).join("");
      eventBoard.innerHTML = keyEvents.map(event => `
        <button class="event-card" type="button" data-event="${esc(event.id)}" data-kind="${esc(event.kind)}">
          <span class="event-card-top">
            <span class="event-card-title">${esc(event.title)}</span>
            <span class="cue-time">${formatTime(event.time)}</span>
          </span>
          <span class="event-card-text">${esc(event.text)}</span>
        </button>
      `).join("");
      document.querySelectorAll("[data-event]").forEach(button => {
        button.addEventListener("click", () => {
          const hit = keyEvents.find(event => event.id === button.dataset.event);
          if (hit) seekTo(hit.time);
        });
      });
    }

    function updateEventVisibility() {
      eventToggleBtn.textContent = eventsVisible ? "隐藏关键事件" : "显示关键事件";
      eventToggleBtn.setAttribute("aria-pressed", String(eventsVisible));
      eventTimeline.classList.toggle("visible", eventsVisible);
    }

    function renderTranscript() {
      document.getElementById("cueCount").textContent = `${cues.length} 条`;
      document.getElementById("transcript").innerHTML = cues.map(cue => `
        <button class="cue" type="button" data-cue="${cue.index}">
          <span class="cue-time">${formatTime(cue.start)}</span>
          <span class="cue-text">${esc(cue.text)}</span>
        </button>
      `).join("");
      document.querySelectorAll(".cue").forEach(button => {
        button.addEventListener("click", () => {
          const hit = cues.find(cue => cue.index === Number(button.dataset.cue));
          if (!hit) return;
          seekTo(hit.start);
        });
      });
      renderKeyEvents();
      updateEventVisibility();
    }

    function updateVideoState() {
      const now = video.currentTime || 0;
      const cue = currentCue();
      const activeEvent = nearestEvent(now);
      const activeDemoCaption = demoCaption && demoCaption.start <= now && demoCaption.end >= now;
      document.getElementById("currentTime").textContent = formatTime(now);
      document.getElementById("activeCaption").textContent = activeDemoCaption ? demoCaption.text : (cue ? cue.text : "当前没有字幕");
      document.querySelectorAll(".cue").forEach(button => {
        const hit = cues.find(item => item.index === Number(button.dataset.cue));
        button.classList.toggle("active", Boolean(hit && hit.start <= now && hit.end >= now));
      });
      document.querySelectorAll("[data-event]").forEach(button => {
        button.classList.toggle("active", Boolean(activeEvent && button.dataset.event === activeEvent.id));
      });
    }

    function renderTeams() {
      if (!siteData) return;
      const teams = siteData.teams || [];
      teamSelect.innerHTML = `<option value="">自动识别背景球队</option>` + teams
        .filter(team => team.players && team.players.length)
        .map(team => `<option value="${esc(team.id)}">${esc(team.nameZh || team.country)} / ${esc(team.country)}</option>`)
        .join("");
    }

    function selectedTeam() {
      const teams = siteData?.teams || [];
      return teams.find(team => team.id === teamSelect.value) || null;
    }

    function playerSummary(player, team) {
      const name = player.nameZh || player.name || "球员";
      const role = player.roleZh || player.roleEn || player.position || "";
      const club = player.club ? `，俱乐部 ${player.club}` : "";
      const caps = player.caps !== null && player.caps !== undefined ? `，国家队出场 ${player.caps} 次` : "";
      return `${name}（${team.nameZh || team.country} #${player.number || "-"}，${role}${club}${caps}）`;
    }

    function playersForQuestion(question) {
      const teams = siteData?.teams || [];
      const selected = selectedTeam();
      const number = String(question).match(/(\d{1,2})\s*号/);
      const pool = selected ? [selected] : teams;
      if (number) {
        return pool.flatMap(team => (team.players || [])
          .filter(player => String(player.number || "") === number[1])
          .map(player => ({ team, player })))
          .slice(0, 8);
      }
      const lower = String(question).toLocaleLowerCase();
      const tokens = lower.split(/[^\p{L}\p{N}]+/u).filter(token => token.length >= 2);
      return pool.flatMap(team => (team.players || [])
        .filter(player => [player.name, player.nameZh, player.club, player.roleZh, player.roleEn]
          .filter(Boolean)
          .some(value => {
            const field = String(value).toLocaleLowerCase();
            return field.includes(lower) || lower.includes(field) || tokens.some(token => field.includes(token));
          }))
        .map(player => ({ team, player })))
        .slice(0, 8);
    }

    function localAnswer(question) {
      const cue = currentCue();
      const near = nearbyCues(70, 25);
      const selected = selectedTeam();
      const hits = playersForQuestion(question);
      const eventHits = near.filter(item => /进球|打门|射门|梅西|战术|防线|包夹|换人|反击/.test(item.text)).slice(-6);
      const lower = String(question || "").toLocaleLowerCase();

      if (/你是谁|你是什么|你能做什么|who are you|what are you/.test(lower)) {
        return [
          "**我是这个页面里的世界杯视频问答助手。**",
          "我会结合当前视频时间、附近字幕和阵容数据回答比赛片段、球员背景、球队信息和战术问题。",
          chatEndpoint ? "当前状态：API 已配置，会优先走对话接口。" : "当前状态：未配置远程 API，先使用本页已加载的字幕和阵容上下文回答。"
        ].join("\n\n");
      }

      if (hits.length && /介绍|是谁|几号|球员|队员|身世|经历|背景/.test(question)) {
        const lines = hits.slice(0, 3).map(({ team, player }) => {
          const story = player.storyZh || player.storyEn || "";
          const current = player.currentZh || player.currentEn || "";
          return `${playerSummary(player, team)}。${story} ${current}`.trim();
        });
        return lines.join("\n\n");
      }

      if (/谁.*进球|进球.*谁|谁进|goal|scored/.test(lower)) {
        const goal = eventHits.find(item => /进球|破门|球进|打进/.test(item.text))
          || cues.find(item => /梅西.*球进|球进了|打进/.test(item.text));
        if (goal) return `刚刚进球的是梅西。解说里对应的信息是：${goal.text}`;
        const latest = eventHits[0] || cue || near.at(-1);
        return latest
          ? `这段暂时没有明确出现“谁进球”的信息。刚才更像是在推进比赛描述：${latest.text}`
          : "现在还没有足够的比赛内容可以判断是谁进球。你可以继续播放一小段，我会跟着当前时间回答。";
      }

      if (/战术|变化|阵型|防线|压迫|包夹|局面|形势/.test(question)) {
        const tactical = eventHits.length ? eventHits : near.slice(-5);
        if (!tactical.length) {
          const summary = cues.filter(item => /阿根廷|阿尔及利亚|梅西|领先|防线|进球/.test(item.text)).slice(0, 8);
          return summary.length
            ? `目前局面可以概括为：${summary.map(item => item.text).join("；")}。阿根廷通过梅西的终结取得领先，阿尔及利亚主要依靠紧凑防线和中场逼抢限制推进。`
            : "这段还没有足够的战术信息。继续播放后，我可以根据当前比赛进程帮你判断压迫、推进和防守变化。";
        }
        return `目前局面比较值得注意的是：${tactical.map(item => item.text).join("；")}。整体看，阿根廷在控球推进和梅西回撤接应上更主动，阿尔及利亚则依靠紧凑防线和中场逼抢制造拦截机会。`;
      }

      if (/点球|penalty/.test(lower)) {
        return "点球通常发生在防守方在本方禁区内犯规时，由进攻方在点球点主罚。主罚前守门员必须留在球门线上，其他球员要在禁区外、点球点后方并保持规定距离；球被踢并明显移动后比赛恢复。";
      }

      if (selected && /球队|背景|阵容|教练/.test(question)) {
        return `${selected.nameZh || selected.country}这支队伍目前的信息是：${selected.currentZh || selected.storyZh || selected.currentEn || "阵容资料已经载入，可以继续问具体球员、号码或位置。"}`;
      }

      const moments = eventHits.length ? eventHits : near.slice(-5);
      if (/刚才|刚刚|当前|现在|这一段|发生|说了什么|summary|summarize/.test(lower) && moments.length) {
        return `刚才这段主要在说：${moments.map(item => item.text).join("；")}。`;
      }
      if (/几比几|比分|领先|落后|score/.test(lower)) {
        return moments.length
          ? `从当前上下文还不能可靠判断完整比分；附近解说重点是：${moments.map(item => item.text).join("；")}。`
          : "当前字幕里还没有足够信息判断比分。";
      }
      if (cue) return `这个问题没有在已载入的球员或字幕上下文中直接命中。当前这一瞬间的重点是：${cue.text}`;
      return DEMO_REPLY;
    }

    function previousMessages(limit = 8) {
      return messages
        .slice(0, -1)
        .filter(item => item.role === "user" || item.role === "assistant")
        .slice(-limit);
    }

    function payloadFor(question) {
      return {
        question,
        currentTime: video.currentTime || 0,
        teamId: teamSelect.value,
        activeSubtitle: currentCue(),
        nearbySubtitles: nearbyCues(),
        commentaryCues: cues,
        history: previousMessages(6)
      };
    }

    function isPlayerProfileQuestion(question) {
      const text = String(question || "");
      const playerIntent = /(介绍|身世|经历|背景|履历|俱乐部|国家队|球员|队员|几号|\d{1,2}\s*号|是谁)/.test(text);
      const videoIntent = /(刚才|刚刚|当前|现在|这一段|这段|进球|战术|发生|打门|射门|字幕|视频|比赛)/.test(text);
      return playerIntent && !videoIntent;
    }

    function directMessagesFor(question) {
      const selected = selectedTeam();
      const profileQuestion = isPlayerProfileQuestion(question);
      const nearby = profileQuestion
        ? "本问题是球员/号码资料问题，请优先使用上方相关球员；当前字幕不可用来否定已命中的球员资料。"
        : nearbyCues().map(cue => `[${formatTime(cue.start)}-${formatTime(cue.end)}] ${cue.text}`).join("\n");
      const playerHits = playersForQuestion(question).map(({ team, player }) => `- ${playerSummary(player, team)}`).join("\n");
      const teamText = selected ? `${selected.nameZh || selected.country}: ${selected.currentZh || selected.storyZh || selected.currentEn || ""}` : "未手动选择球队。";
      const fullCommentary = cues.map(cue => `[${formatTime(cue.start)}-${formatTime(cue.end)}] ${cue.text}`).join("\n");
      return [
        {
          role: "system",
          content: "你是世界杯视频问答助手。请用中文直接给观众最终答案，语气自然简洁。问刚才、这一段、进球或局面时，优先使用交互视频 commentary.json 的时间轴和当前播放时间；问球员、队员、几号、身世、经历、俱乐部或国家队履历时，优先使用阵容背景；问足球规则时可以给出简洁规则解释。证据不足时只说还不能确定。可以使用简洁 Markdown。"
        },
        ...previousMessages(7),
        {
          role: "user",
          content: `当前播放时间：${formatTime(video.currentTime || 0)}\n\n背景球队：\n${teamText}\n\n可能相关球员（回答球员/号码问题时优先）：\n${playerHits || "无"}\n\n附近字幕：\n${nearby || "无"}\n\n交互视频 commentary.json 全量时间轴：\n${fullCommentary || "无"}\n\n用户问题：${question}`
        }
      ];
    }

    function usesChatCompletions(endpoint) {
      return /\/chat\/completions\/?$/i.test(endpoint) || chatConfig.endpointType === "openai";
    }

    function requestBodyFor(question, endpoint) {
      if (usesChatCompletions(endpoint)) {
        return {
          model: window.VIDEO_CHAT_MODEL || chatConfig.model || "deepseek-v4-pro",
          messages: directMessagesFor(question),
          temperature: 0.25,
          max_tokens: 900
        };
      }
      return payloadFor(question);
    }

    function requestHeaders() {
      const headers = { "Content-Type": "application/json" };
      const apiKey = String(window.VIDEO_CHAT_API_KEY || chatConfig.apiKey || "").trim();
      if (apiKey) headers.Authorization = `Bearer ${apiKey}`;
      return headers;
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function requestAssistant(question, endpoint) {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: requestHeaders(),
        body: JSON.stringify(requestBodyFor(question, endpoint))
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.error) throw new Error(data.error || `HTTP ${response.status}`);
      const answer = data.answer || data.choices?.[0]?.message?.content || data.output_text || "";
      if (!String(answer).trim()) throw new Error("API returned an empty answer");
      return answer;
    }

    async function ask(question) {
      if (pending || !question.trim()) return;
      pending = true;
      sendBtn.disabled = true;
      voiceBtn.disabled = true;
      const cleanQuestion = question.trim();
      messages.push({ role: "user", content: cleanQuestion });
      renderMessage("user", cleanQuestion);
      const endpoint = resolveChatEndpoint();
      renderMessage("system", THINKING_REPLY);
      const responseDelay = delay(TYPED_RESPONSE_DELAY_MS);
      setApiState(endpoint ? "ready" : "local", endpoint ? "API 已连接" : "本地上下文模式");
      try {
        const answerPromise = endpoint ? requestAssistant(cleanQuestion, endpoint) : Promise.resolve(localAnswer(cleanQuestion));
        const [answer] = await Promise.all([answerPromise, responseDelay]);
        messages.push({ role: "assistant", content: answer });
        renderMessage("assistant", answer);
        setApiState(endpoint ? "ready" : "local", endpoint ? "API 已连接" : "本地上下文模式");
      } catch (error) {
        console.warn("Video chat API unavailable, using page context.", error);
        const fallback = localAnswer(cleanQuestion);
        await responseDelay;
        if (!apiErrorNotified) {
          renderMessage("system", "API 请求失败，已临时切换到本地字幕和阵容上下文。");
          apiErrorNotified = true;
        }
        messages.push({ role: "assistant", content: fallback });
        renderMessage("assistant", fallback);
        setApiState("local", "API 失败·本地模式");
      } finally {
        pending = false;
        sendBtn.disabled = false;
        voiceBtn.disabled = false;
        questionInput.value = "";
        questionInput.focus();
      }
    }

    function injectDemoCaption() {
      const now = video.currentTime || 0;
      demoCaption = {
        start: now + 1.7,
        end: now + 8.5,
        text: DEMO_REPLY
      };
      injectDemoSubtitleCue(demoCaption);
      setTimeout(updateVideoState, 1700);
    }

    function injectDemoSubtitleCue(caption) {
      if (!window.VTTCue || !video.textTracks) return;
      const track = video.textTracks[0] || video.addTextTrack("subtitles", "中文", "zh");
      track.mode = "showing";
      if (demoSubtitleCue) {
        try { track.removeCue(demoSubtitleCue); } catch {}
      }
      demoSubtitleCue = new VTTCue(caption.start, caption.end, caption.text);
      try { track.addCue(demoSubtitleCue); } catch {}
    }

    function runDemoInteraction(question, source = "text") {
      const cleanQuestion = String(question || "").trim() || (source === "voice" ? "语音输入" : "文字输入");
      messages.push({ role: "user", content: cleanQuestion });
      renderMessage("user", cleanQuestion);
      injectDemoCaption();
      messages.push({ role: "assistant", content: DEMO_REPLY });
      renderMessage("assistant", DEMO_REPLY);
      setApiState("local", source === "voice" ? "语音演示模式" : "文字演示模式");
      questionInput.value = "";
      questionInput.focus();
    }

    async function requestMicrophoneAccess() {
      if (!navigator.mediaDevices?.getUserMedia) return;
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(track => track.stop());
    }

    function resetVoiceButton() {
      listening = false;
      voiceBtn.disabled = false;
      voiceBtn.classList.remove("listening");
      voiceBtn.setAttribute("aria-label", "语音输入");
      voiceBtn.title = "点击录音并转文字";
    }

    async function startVoiceInput() {
      if (pending) return;
      if (listening && recognition) {
        recognition.abort();
        resetVoiceButton();
        return;
      }
      if (!SpeechRecognition) {
        renderMessage("system", "当前浏览器不支持语音识别，请使用 Chrome、Edge 或 Safari 等支持 Web Speech API 的浏览器。");
        return;
      }
      if (!window.isSecureContext) {
        renderMessage("system", "语音输入需要 HTTPS 或 localhost 才能请求麦克风权限。");
        return;
      }

      try {
        await requestMicrophoneAccess();
      } catch (error) {
        renderMessage("system", "麦克风权限未开启，允许浏览器使用麦克风后再试一次。");
        return;
      }

      if (recognition) recognition.abort();
      let finalTranscript = "";
      let voiceError = "";

      recognition = new SpeechRecognition();
      recognition.lang = "zh-CN";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;
      listening = true;
      voiceBtn.classList.add("listening");
      voiceBtn.setAttribute("aria-label", "正在录音，点击停止");
      voiceBtn.title = "正在录音，点击停止";
      setApiState("local", "正在听写语音");

      recognition.onresult = event => {
        let interimTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const transcript = event.results[i]?.[0]?.transcript || "";
          if (event.results[i].isFinal) finalTranscript += transcript;
          else interimTranscript += transcript;
        }
        questionInput.value = (finalTranscript + interimTranscript).trim();
      };

      recognition.onerror = event => {
        voiceError = event.error || "unknown";
        renderMessage("system", voiceError === "not-allowed" || voiceError === "service-not-allowed"
          ? "麦克风权限被拒绝，请在浏览器地址栏里允许麦克风。"
          : "语音识别没有完成，请靠近麦克风再试一次。");
      };

      recognition.onend = async () => {
        const transcript = finalTranscript.trim() || questionInput.value.trim();
        resetVoiceButton();
        if (voiceError) return;
        if (!transcript) {
          renderMessage("system", "没有识别到语音内容，请再点一次麦克风重试。");
          return;
        }
        questionInput.value = "";
        messages.push({ role: "user", content: transcript });
        renderMessage("user", transcript);
        await delay(VOICE_THINKING_DELAY_MS);
        renderMessage("system", THINKING_REPLY);
        await delay(VOICE_FINAL_DELAY_MS);
        messages.push({ role: "assistant", content: DEMO_REPLY });
        renderMessage("assistant", DEMO_REPLY);
        setApiState(chatEndpoint ? "ready" : "local", chatEndpoint ? "API 已连接" : "本地上下文模式");
      };

      try {
        recognition.start();
      } catch (error) {
        resetVoiceButton();
        renderMessage("system", "语音识别启动失败，请刷新页面后再试。");
      }
    }

    function handleDemoSubmit() {
      const typed = questionInput.value.trim();
      if (typed) {
        ask(typed);
        return;
      }
      startVoiceInput();
    }

    function updateInteractionMode() {
      const demo = interactionMode === "demo";
      modeLabel.textContent = demo ? "语音/文字交互演示" : "API 智能问答";
      modeToggle.textContent = demo ? "切换到 API 智能问答" : "切换到语音/文字交互";
      const label = demo ? "交互" : "智能问答";
      sendBtn.setAttribute("aria-label", label);
      sendLabel.textContent = label;
      questionInput.required = !demo;
      questionInput.placeholder = demo ? "输入演示问题；留空点击可尝试语音输入" : "问视频片段、球员背景或足球规则";
      setApiState(chatEndpoint ? "ready" : "local", demo ? "语音/文字演示模式" : (chatEndpoint ? "API 已连接" : "本地上下文模式"));
    }

    async function init() {
      renderMessage("system", "2026FIFA看球伙伴已就位，问我这段比赛、球员或球队背景都可以。");
      const [commentaryResponse, dataResponse] = await Promise.all([
        fetch("assets/video/interaction-commentary.json"),
        fetch("worldcup_site.json")
      ]);
      cues = parseCommentaryJson(await commentaryResponse.json());
      siteData = await dataResponse.json();
      renderTranscript();
      renderTeams();
      updateVideoState();
      setApiState(chatEndpoint ? "ready" : "local", chatEndpoint ? "API 已连接" : "本地上下文模式");
    }

    document.getElementById("chatForm").addEventListener("submit", event => {
      event.preventDefault();
      if (interactionMode === "demo") {
        handleDemoSubmit();
        return;
      }
      ask(questionInput.value);
    });

    modeToggle.addEventListener("click", () => {
      interactionMode = interactionMode === "api" ? "demo" : "api";
      updateInteractionMode();
      questionInput.focus();
    });

    chatTab.addEventListener("click", () => setBoardMode("chat"));
    boardTab.addEventListener("click", () => setBoardMode("board"));

    eventToggleBtn.addEventListener("click", () => {
      eventsVisible = !eventsVisible;
      updateEventVisibility();
      if (eventsVisible) setBoardMode("board");
    });

    voiceBtn.addEventListener("click", startVoiceInput);

    document.querySelectorAll(".chip").forEach(button => {
      button.addEventListener("click", () => ask(button.dataset.question));
    });

    document.getElementById("askCurrentBtn").addEventListener("click", () => {
      const cue = currentCue();
      ask(cue ? `解释一下 ${formatTime(cue.start)} 这一段：“${cue.text}”` : "解释一下当前这一段。");
    });

    document.getElementById("fullscreenBtn").addEventListener("click", () => {
      const target = video;
      if (target.requestFullscreen) target.requestFullscreen();
    });

    teamSelect.addEventListener("change", () => setApiState(chatEndpoint ? "ready" : "local", chatEndpoint ? "API 已连接" : "本地上下文模式"));
    video.addEventListener("loadedmetadata", () => renderKeyEvents());
    video.addEventListener("play", updateVideoState);
    video.addEventListener("timeupdate", updateVideoState);
    setBoardMode("chat");
    updateInteractionMode();

    init().catch(error => {
      renderMessage("system", `页面数据载入失败：${error.message}`);
    });
  </script>
</body>
</html>
